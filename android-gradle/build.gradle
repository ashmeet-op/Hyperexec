plugins {
    id 'com.android.library' version '8.11.1'
}

android {
    namespace 'git.artdeell.mojoexec.native'
    compileSdk 37

    defaultConfig {
        minSdk 21
        targetSdk 37

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
        }
    }
}

dependencies {
    implementation project(':mojoexec:jni_bindings')
}
